name = "cqntrack-backend"
main = "src/index.ts"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "cqntrack-db"
database_id = "b73c1d13-fd3d-4ad4-898e-c02ae5d5aca0"
migrations_dir = "drizzle"

[vars]
BETTER_AUTH_URL = "https://api.track.cqn.xyz.br"
FRONTEND_ORIGIN = "https://tracker.cqn.xyz.br"
COOKIE_DOMAIN = ".cqn.xyz.br"
EMAIL_FROM = "cqntrack <noreply@mail.cqn.xyz.br>"

[observability]
enabled = true

# De hora em hora — atualiza o cache de próximo episódio/último lançado das
# séries acompanhadas não finalizadas (ver src/series/refresh-episodes.job.ts
# e scheduled() em src/index.ts). Cada execução processa só as ~20 mais
# desatualizadas (teto de subrequests/invocação do Free); com ~50 séries
# não-finalizadas na base hoje, isso já é suficiente pra manter todo mundo
# em dia. 1 único slot dos 5 Cron Triggers/conta do Free.
[triggers]
crons = ["0 * * * *"]

# Contadores de verdade compartilhados pela conta (não por isolate) — ao
# contrário de um rate limit em memória de aplicação, que não é confiável em
# Workers (cada isolate/PoP teria seu próprio contador). Ver
# src/auth/rate-limit.ts e src/auth/require-session.ts.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 180, period = 60 }
